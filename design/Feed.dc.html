<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>האכלת מחמצת</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap">
<style>
body{margin:0}
@keyframes jarRise{0%{transform:translateY(14px);opacity:0}10%{transform:translateY(14px);opacity:1}78%{transform:translateY(0);opacity:1}92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.jar-rise{animation:jarRise 10s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-9px);opacity:0}}
.bub{animation:bub 2.6s ease-in infinite}.bub.d1{animation-delay:.8s}.bub.d2{animation-delay:1.6s}
@keyframes domeRise{0%{transform:scale(.55);opacity:0}10%{transform:scale(.55);opacity:1}80%{transform:scale(1);opacity:1}92%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.dome{transform-box:fill-box;transform-origin:50% 100%;animation:domeRise 10s cubic-bezier(.4,0,.2,1) infinite}
@keyframes loafSpring{0%{transform:scale(.9,.58);opacity:0}8%{transform:scale(.9,.58);opacity:1}60%{transform:scale(1,1);opacity:1}92%{transform:scale(1,1);opacity:1}100%{transform:scale(1,1);opacity:0}}
.loaf{transform-box:fill-box;transform-origin:50% 100%;animation:loafSpring 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes ear{0%,8%{stroke-width:.6}60%{stroke-width:4.6}100%{stroke-width:4.6}}
.ear{animation:ear 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.8}100%{transform:translateY(-6px);opacity:0}}
.steam{animation:steam 3s ease-out infinite}.steam.d1{animation-delay:1.2s}
@media (prefers-reduced-motion: reduce){.jar-rise,.bub,.dome,.loaf,.ear,.steam{animation:none}}
a{color:#B4572B}a:hover{color:#7E3A19}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 1300px; box-sizing: border-box; background: #F5EEE2; font-family: 'Assistant', sans-serif; color: #2A1F16; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 18px; direction: ltr">DoughMate</div>
<div style="font-size: 14px; color: #8A7A68">שלב 2 מתוך 4</div>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{track}}" as="t" hint-placeholder-count="4">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="{{t.bar}}"></div>
<div style="{{t.lab}}">{{t.name}}</div>
</div>
</sc-for>
</div>
</div>

<div style="background: linear-gradient(160deg, #FFF8EC 0%, #F6E4D2 100%); border: 1px solid #EBCFB6; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 28px rgba(126,58,25,.10)">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 15px; font-weight: 600; color: #8A7A68">האכלה הבאה · 3 מתוך 3</div>
<span style="background: #F6E4D2; color: #7E3A19; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; direction: ltr">1:10:10</span>
</div>
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 300; font-size: 76px; line-height: 1.05; color: #B4572B; direction: ltr; text-align: right">21:00</div>
<div style="font-size: 15px; color: #8A7A68">ראשון · שיא צפוי ביום שני ב־08:00</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{amounts}}" as="a" hint-placeholder-count="3">
<div style="background: #F6E4D2; border-radius: 14px; padding: 12px 6px; text-align: center">
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 300; font-size: 40px; line-height: 1.1">{{a.value}}</div>
<div style="font-size: 13px; color: #7A5538">{{a.label}}</div>
</div>
</sc-for>
</div>
<div style="font-size: 14px; color: #8A7A68">בכל האכלה, כשהמחמצת בשיא · 54 ג׳ נשארים בצנצנת אחרי הלישה</div>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #E7DCCB">
<div style="{{r.dot}}">
<sc-if value="{{r.isDone}}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
<sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #B4572B"></span>
</sc-if>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="{{r.title}}">{{r.text}}</div>
<div style="font-size: 14px; color: #8A7A68">{{r.sub}}</div>
<sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 14px; margin-top: 8px">
<div style="position: relative; width: 168px; height: 168px; flex: none">
<svg width="168" height="168" viewBox="0 0 168 168" style="transform: rotate(-90deg)" aria-hidden="true"><circle cx="84" cy="84" r="76" fill="none" stroke="#EBCFB6" stroke-width="7"/><circle cx="84" cy="84" r="76" fill="none" stroke="#B4572B" stroke-width="7" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="463.2"/></svg>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="88" height="66" viewBox="0 0 88 66" aria-hidden="true"><defs><clipPath id="jarClip"><path d="M26 13c-6 3-8 8-8 14v28a6 6 0 0 0 6 6h40a6 6 0 0 0 6-6V27c0-6-2-11-8-14z"/></clipPath></defs><path d="M26 13c-6 3-8 8-8 14v28a6 6 0 0 0 6 6h40a6 6 0 0 0 6-6V27c0-6-2-11-8-14z" fill="#FFFCF6" fill-opacity=".7"/><g clip-path="url(#jarClip)"><g class="jar-rise"><path d="M10 34q6-4 12 0t12 0t12 0t12 0t12 0V70H10z" fill="#F2D3A0"/><circle class="bub" cx="30" cy="52" r="2.2" fill="#FFF3DC"/><circle class="bub d1" cx="44" cy="58" r="1.6" fill="#FFF3DC"/><circle class="bub d2" cx="56" cy="50" r="2" fill="#FFF3DC"/><circle class="bub d1" cx="38" cy="44" r="1.4" fill="#FFF3DC"/></g></g><path d="M26 13c-6 3-8 8-8 14v28a6 6 0 0 0 6 6h40a6 6 0 0 0 6-6V27c0-6-2-11-8-14z" fill="none" stroke="#7E3A19" stroke-width="2.4" stroke-linejoin="round"/><rect x="24" y="4" width="40" height="7" rx="2.5" fill="#B4572B"/><rect x="18" y="47" width="52" height="3" fill="#B4572B" fill-opacity=".85"/></svg><span style="font-family: 'Frank Ruhl Libre', serif; font-weight: 400; font-size: 21px; line-height: 1.1; color: #7E3A19; direction: ltr; letter-spacing: -0.5px">10:42:15</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 600; color: #7E3A19; line-height: 1.3">נשאר עד האכלה 3</div>
<div style="font-size: 13px; color: #8A7A68">ראשון · 21:00</div>
<div style="display: flex; gap: 8px; margin-top: 4px"><button type="button" aria-label="השהה" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #B4572B; background: transparent; color: #7E3A19; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button><button type="button" aria-label="אפס" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #B4572B; background: transparent; color: #7E3A19; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg></button></div>
</div>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>

<div style="margin-top: auto">
<a href="Dough.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #B4572B; color: #FFFCF6; border-radius: 16px; min-height: 56px; font-size: 17px; font-weight: 700; text-decoration: none">המחמצת בשיא, מתחילים ללוש
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const A = '#B4572B', LINE = '#E7DCCB', MUTED = '#8A7A68';
    const stage = 1;
    const track = ['תכנון', 'האכלה', 'בצק', 'אפייה'].map((name, i) => ({
      name,
      bar: 'height: 3px; border-radius: 2px; background: ' + (i <= stage ? A : LINE),
      lab: 'font-size: 12px; font-weight: ' + (i === stage ? 700 : 400) + '; color: ' + (i === stage ? '#2A1F16' : MUTED)
    }));
    const amounts = [
      { value: '24', label: 'ג׳ מחמצת' },
      { value: '240', label: 'ג׳ קמח חיטה לבן' },
      { value: '240', label: 'ג׳ מים' }
    ];
    const amt = '24 ג׳ מחמצת + 240 ג׳ קמח + 240 ג׳ מים';
    const rows = [
      { text: 'האכלה 1 · שבת 23:00', sub: amt, state: 'done' },
      { text: 'המתנה לשיא', sub: 'הסתיימה ביום ראשון ב־10:00', state: 'done', wait: true },
      { text: 'האכלה 2 · ראשון 10:00', sub: amt, state: 'done' },
      { text: 'המתנה לשיא', sub: 'עד האכלה 3 ביום ראשון ב־21:00', state: 'run', wait: true },
      { text: 'האכלה 3 · ראשון 21:00', sub: amt, state: 'todo' },
      { text: 'המתנה לשיא', sub: 'שני 08:00, ואז מתחילים ללוש', state: 'todo', wait: true }
    ].map(r => ({
      text: r.text,
      sub: r.sub,
      isDone: r.state === 'done',
      isRun: r.state === 'run',
      dot: 'flex: none; width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' +
        (r.state === 'done' ? 'background: ' + A : r.state === 'run' ? 'border: 2px solid ' + A : 'border: 2px solid ' + LINE),
      title: 'font-size: ' + (r.wait ? 15 : 17) + 'px; font-weight: ' + (r.wait ? 600 : 700) + '; line-height: 1.35; color: ' + (r.state === 'done' || r.wait ? MUTED : '#2A1F16')
    }));
    return { track, amounts, rows };
  }
}
</script>
</body>
</html>
