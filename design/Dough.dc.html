<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>הכנת הבצק</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap">
<style>
body{margin:0}
@keyframes jarRise{0%{transform:translateY(14px);opacity:0}10%{transform:translateY(14px);opacity:1}78%{transform:translateY(0);opacity:1}92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.jar-rise{animation:jarRise 10s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-9px);opacity:0}}
.bub{animation:bub 2.6s ease-in infinite}.bub.d1{animation-delay:.8s}.bub.d2{animation-delay:1.6s}
@keyframes domeRise{0%{transform:scale(.55);opacity:0}10%{transform:scale(.55);opacity:1}80%{transform:scale(1);opacity:1}92%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.dome{transform-box:fill-box;transform-origin:50% 100%;animation:domeRise 10s cubic-bezier(.4,0,.2,1) infinite}
@keyframes loafSpring{0%{transform:scale(.9,.58);opacity:0}8%{transform:scale(.9,.58);opacity:1}60%{transform:scale(1,1);opacity:1}92%{transform:scale(1,1);opacity:1}100%{transform:scale(1,1);opacity:0}}
.loaf{transform-box:fill-box;transform-origin:50% 100%;animation:loafSpring 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes ear{0%,8%{stroke-width:.6}60%{stroke-width:4.6}100%{stroke-width:4.6}}
.ear{animation:ear 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.8}100%{transform:translateY(-6px);opacity:0}}
.steam{animation:steam 3s ease-out infinite}.steam.d1{animation-delay:1.2s}
@keyframes doughRise{0%{transform:translateY(26px);opacity:0}10%{transform:translateY(26px);opacity:1}80%{transform:translateY(0);opacity:1}92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.dough-rise{animation:doughRise 10s cubic-bezier(.4,0,.2,1) infinite}
@media (prefers-reduced-motion: reduce){.dough-rise,.jar-rise,.bub,.dome,.loaf,.ear,.steam{animation:none}}
a{color:#B4572B}a:hover{color:#7E3A19}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 1300px; box-sizing: border-box; background: #F5EEE2; font-family: 'Assistant', sans-serif; color: #2A1F16; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 18px; direction: ltr">DoughMate</div>
<div style="font-size: 14px; color: #8A7A68">שלב 3 מתוך 4</div>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{track}}" as="t" hint-placeholder-count="4">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="{{t.bar}}"></div>
<div style="{{t.lab}}">{{t.name}}</div>
</div>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="min-height: 48px; border-radius: 14px; background: #B4572B; color: #FFFCF6; border: 1px solid #B4572B; font-family: 'Assistant', sans-serif; font-size: 16px; font-weight: 700">לחם</button>
<button type="button" style="min-height: 48px; border-radius: 14px; background: #FFFCF6; color: #2A1F16; border: 1px solid #E7DCCB; font-family: 'Assistant', sans-serif; font-size: 16px; font-weight: 700">פוקצ׳ה</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #8A7A68"><span>לישה התחילה ב־08:20</span><span>הושלמו 2 מתוך 9</span></div>
<div style="height: 4px; border-radius: 2px; background: #E7DCCB"><div style="width: 22%; height: 4px; border-radius: 2px; background: #B4572B"></div></div>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #E7DCCB">
<div style="{{r.dot}}">
<sc-if value="{{r.isDone}}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
<sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #B4572B"></span>
</sc-if>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="{{r.title}}">{{r.text}}</div>
<div style="font-size: 14px; color: #8A7A68">{{r.sub}}</div>
<sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 14px; margin-top: 8px">
<div style="position: relative; width: 168px; height: 168px; flex: none">
<svg width="168" height="168" viewBox="0 0 168 168" style="transform: rotate(-90deg)" aria-hidden="true"><circle cx="84" cy="84" r="76" fill="none" stroke="#EBCFB6" stroke-width="7"/><circle cx="84" cy="84" r="76" fill="none" stroke="#B4572B" stroke-width="7" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="281.7"/></svg>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="88" height="66" viewBox="0 0 88 66" aria-hidden="true"><defs><clipPath id="bowlClip"><path d="M10 6H78V28c0 22-14 36-34 36S10 50 10 28z"/></clipPath></defs><path d="M10 28h68c0 22-14 36-34 36S10 50 10 28z" fill="#FFF8EE"/><g clip-path="url(#bowlClip)"><g class="dough-rise"><path d="M10 26Q44 8 78 26V90H10z" fill="#F2D3A0"/><path d="M10 26Q44 8 78 26" fill="none" stroke="#E3BE86" stroke-width="2" stroke-linecap="round"/><circle class="bub" cx="28" cy="44" r="2" fill="#FFF3DC"/><circle class="bub d1" cx="46" cy="40" r="1.6" fill="#FFF3DC"/><circle class="bub d2" cx="58" cy="50" r="2.2" fill="#FFF3DC"/><circle class="bub d1" cx="38" cy="56" r="1.6" fill="#FFF3DC"/></g></g><path d="M10 28h68c0 22-14 36-34 36S10 50 10 28z" fill="none" stroke="#7E3A19" stroke-width="2.4" stroke-linejoin="round"/><path d="M7 28h74" stroke="#7E3A19" stroke-width="3" stroke-linecap="round"/></svg><span style="font-family: 'Frank Ruhl Libre', serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #7E3A19; direction: ltr; letter-spacing: -0.5px">17:42</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 600; color: #7E3A19; line-height: 1.3">קיפול ראשון בעוד</div>
<div style="font-size: 13px; color: #8A7A68">מסתיים ב־09:10</div>
<div style="display: flex; gap: 8px; margin-top: 4px"><button type="button" aria-label="השהה" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #B4572B; background: transparent; color: #7E3A19; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button><button type="button" aria-label="אפס" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #B4572B; background: transparent; color: #7E3A19; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg></button></div>
</div>
</div>
</sc-if>
<sc-if value="{{r.isChoice}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<button type="button" style="min-height: 44px; border-radius: 12px; background: #B4572B; color: #FFFCF6; border: 1px solid #B4572B; font-family: 'Assistant', sans-serif; font-size: 15px; font-weight: 700">חמה</button>
<button type="button" style="min-height: 44px; border-radius: 12px; background: #FFFCF6; color: #2A1F16; border: 1px solid #E7DCCB; font-family: 'Assistant', sans-serif; font-size: 15px; font-weight: 700">קרה</button>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>

<div style="margin-top: auto">
<a href="Bake.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFCF6; color: #7E3A19; border: 1.5px solid #B4572B; border-radius: 16px; min-height: 56px; font-size: 17px; font-weight: 700; text-decoration: none">לאפייה
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const A = '#B4572B', LINE = '#E7DCCB', MUTED = '#8A7A68';
    const stage = 2;
    const track = ['תכנון', 'האכלה', 'בצק', 'אפייה'].map((name, i) => ({
      name,
      bar: 'height: 3px; border-radius: 2px; background: ' + (i <= stage ? A : LINE),
      lab: 'font-size: 12px; font-weight: ' + (i === stage ? 700 : 400) + '; color: ' + (i === stage ? '#2A1F16' : MUTED)
    }));
    const rows = [
      { text: 'Autolyse / Fermentolyse', sub: 'קמח, מים ומחמצת, בלי מלח', state: 'done' },
      { text: 'עד הוספת מלח', sub: 'הסתיים ב־08:30, המלח נוסף', state: 'done' },
      { text: 'קיפול ראשון', sub: 'Stretch and Fold או Coil Fold', state: 'run' },
      { text: 'קיפול שני', sub: '30 דק׳ אחרי הקודם', state: 'todo' },
      { text: 'קיפול שלישי', sub: '30 דק׳ אחרי הקודם', state: 'todo' },
      { text: 'Poke Test', sub: 'חוזר לאט ולא עד הסוף: מוכן', state: 'todo' },
      { text: 'Pre-shaping, מנוחת ספסל ו־Shaping', sub: 'מנוחה של 15 דק׳ בין השניים', state: 'todo' },
      { text: 'תפיחה סופית', sub: 'חמה: בדיקה כל חצי שעה', state: 'todo', choice: true }
    ].map(r => ({
      text: r.text,
      sub: r.sub,
      isDone: r.state === 'done',
      isRun: r.state === 'run',
      isChoice: !!r.choice,
      dot: 'flex: none; width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' +
        (r.state === 'done' ? 'background: ' + A : r.state === 'run' ? 'border: 2px solid ' + A : 'border: 2px solid ' + LINE),
      title: 'font-size: 17px; font-weight: 700; line-height: 1.35; color: ' + (r.state === 'done' ? MUTED : '#2A1F16')
    }));
    return { track, rows };
  }
}
</script>
</body>
</html>
