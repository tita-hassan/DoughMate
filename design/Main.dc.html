<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>תכנון: מה, מתי, איך</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap">
<style>
body{margin:0}
a{color:#B4572B}a:hover{color:#7E3A19}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 1120px; box-sizing: border-box; background: #F5EEE2; font-family: 'Assistant', sans-serif; color: #2A1F16; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 26px">

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 18px; direction: ltr">DoughMate</div>
<div style="font-size: 14px; color: #8A7A68">שלב 1 מתוך 4</div>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{track}}" as="t" hint-placeholder-count="4">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="{{t.bar}}"></div>
<div style="{{t.lab}}">{{t.name}}</div>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 22px">מה אופים?</h2>
<div style="display: flex; align-items: center; justify-content: space-between; background: #FFFCF6; border: 1.5px solid #B4572B; border-radius: 16px; padding: 6px 8px 6px 18px; min-height: 56px">
<span style="font-weight: 700; font-size: 18px">לבן רגיל</span>
<span style="display: flex; align-items: center; gap: 2px">
<button type="button" aria-label="פחות" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E7DCCB; background: #FFFCF6; font-size: 22px; color: #2A1F16; padding: 0">−</button>
<span style="min-width: 72px; text-align: center; font-family: 'Frank Ruhl Libre', serif; font-size: 18px; font-weight: 500; color: #B4572B">2 כיכרות</span>
<button type="button" aria-label="עוד" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E7DCCB; background: #FFFCF6; font-size: 22px; color: #2A1F16; padding: 0">+</button>
</span>
</div>
<a href="Recipes.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #E7DCCB; background: #FFFCF6; border-radius: 14px; font-size: 15px; font-weight: 700; text-decoration: none">מתכונים נוספים</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 22px">מתי?</h2>
<div style="font-size: 14px; color: #8A7A68">לפי מה נקבע את כל זמני התהליך?</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{anchors}}" as="a" hint-placeholder-count="4">
<button type="button" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; background: #FFFCF6; border: 1px solid #E7DCCB; box-shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05); border-radius: 16px; padding: 14px 18px; min-height: 76px; text-align: start">
<span style="display: flex; flex-direction: column; gap: 0">
<span style="font-size: 13px; color: #8A7A68">תחילת אפייה</span>
<span style="font-family: 'Frank Ruhl Libre', serif; font-weight: 300; font-size: 34px; line-height: 1.15; color: #2A1F16">שני · 14:00</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7A68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 22px">איך?</h2>
<div style="font-size: 14px; color: #8A7A68">כל שלבי ההכנה של המתכון, לפי ההגדרות שלו</div>
</div>
<a href="Settings.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center">עריכה</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{how}}" as="h" hint-placeholder-count="8">
<span style="background: #FFFCF6; border: 1px solid #E7DCCB; box-shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600">{{h}}</span>
</sc-for>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFCF6; border: 1px solid #E7DCCB; box-shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05); border-radius: 16px; display: flex">
<sc-for list="{{plan}}" as="p" hint-placeholder-count="3">
<div style="{{p.cell}}">
<div style="font-size: 13px; color: #8A7A68">{{p.label}}</div>
<div style="font-family: 'Frank Ruhl Libre', serif; font-weight: 400; font-size: 24px; line-height: 1.2">{{p.time}}</div>
<div style="font-size: 13px; color: #8A7A68">{{p.day}}</div>
</div>
</sc-for>
</div>
<a href="Feed.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #B4572B; color: #FFFCF6; border-radius: 16px; min-height: 56px; font-size: 17px; font-weight: 700; text-decoration: none">בנה לוח זמנים
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const A = '#B4572B', LINE = '#E7DCCB', MUTED = '#8A7A68';
    const track = ['תכנון', 'האכלה', 'בצק', 'אפייה'].map((name, i) => ({
      name,
      bar: 'height: 3px; border-radius: 2px; background: ' + (i === 0 ? A : LINE),
      lab: 'font-size: 12px; font-weight: ' + (i === 0 ? 700 : 400) + '; color: ' + (i === 0 ? '#2A1F16' : MUTED)
    }));
    const labels = ['סוף אפייה', 'תחילת אפייה', 'סוף תפיחה', 'מחמצת בשיא'];
    const anchors = labels.map((label, i) => ({
      label,
      style: 'min-height: 48px; border-radius: 14px; font-family: Assistant, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; ' +
        (i === 1 ? 'background: ' + A + '; color: #FFFCF6; border: 1px solid ' + A : 'background: #FFFCF6; color: #2A1F16; border: 1px solid ' + LINE)
    }));
    const how = ['3 האכלות בשיא', 'פרמנטוליזה', 'לישה ידנית', '3 קיפולים, כל 30 דק׳', 'כ־5 שעות עד עיצוב', 'תפיחה חמה', 'תנור הולנדי', 'אפייה 20 + 20 דק׳', 'חדר 24°'];
    const plan = [
      { label: 'האכלה ראשונה', time: '23:00', day: 'שבת' },
      { label: 'לישה', time: '08:20', day: 'שני' },
      { label: 'אפייה', time: '14:00', day: 'שני' }
    ].map((p, i) => ({
      ...p,
      cell: 'flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 0; ' + (i > 0 ? 'border-right: 1px solid ' + LINE : '')
    }));
    return { track, anchors, how, plan };
  }
}
</script>
</body>
</html>
