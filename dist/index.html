var H="<title>DoughMate<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap\">\n<style>\n/* Layout: one phone-width column. Stage track on top, one view at a time (plan, feed, dough, bake, recipes, settings). Warm bakery palette, serif numerals, ring timers with a small animated scene per stage. */\n:root {\n  --bg: #F5EEE2; --card: #FFFCF6; --ink: #2A1F16; --mut: #6F5F4E; --line: #E7DCCB;\n  --acc: #B4572B; --acc-ink: #FFFCF6; --deep: #7E3A19; --tint: #F6E4D2; --tint2: #EBCFB6;\n  --dough: #F2D3A0; --dough-edge: #E3BE86; --crust: #D0873F; --bubble: #FFF3DC; --ear: #FFE9C2; --stone: #2A1F16;\n  --warn-bg: #F8DDD0; --warn: #8A2F12;\n  --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05);\n  --f-disp: 'Frank Ruhl Libre', Georgia, serif;\n  --f-body: 'Assistant', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #1C1510; --card: #261C15; --ink: #F3E9DC; --mut: #BBA992; --line: #3A2D22;\n    --acc: #E58A55; --acc-ink: #1C1510; --deep: #F0B48E; --tint: #3A281C; --tint2: #5A3D29;\n    --dough: #D9B27C; --dough-edge: #B98F58; --crust: #C47A38; --bubble: #F6DDB0; --stone: #6B5644;\n    --warn-bg: #4A241A; --warn: #F2A98A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #1C1510; --card: #261C15; --ink: #F3E9DC; --mut: #BBA992; --line: #3A2D22;\n  --acc: #E58A55; --acc-ink: #1C1510; --deep: #F0B48E; --tint: #3A281C; --tint2: #5A3D29;\n  --dough: #D9B27C; --dough-edge: #B98F58; --crust: #C47A38; --bubble: #F6DDB0; --stone: #6B5644;\n  --warn-bg: #4A241A; --warn: #F2A98A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);\n  color-scheme: dark;\n}\n* { box-sizing: border-box; }\nbody { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;\n  padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }\nbutton, input, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }\n.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }\n.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }\nh1, h2, h3, p { margin: 0; }\n.mut { color: var(--mut); }\n\n/* header and track */\n.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.brand { font-family: var(--f-disp); font-size: 21px; font-weight: 500; direction: ltr; letter-spacing: -.3px; }\n.brand b { color: var(--acc); font-weight: 500; }\n.icons { display: flex; gap: 4px; }\n.ib { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink); }\n.ib[aria-pressed=\"true\"] { border-color: var(--acc); color: var(--acc); }\n.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }\n.tk { background: none; border: 0; padding: 6px 0 2px; display: flex; flex-direction: column; gap: 6px; text-align: start; min-height: 44px; }\n.tk i { display: block; height: 3px; border-radius: 2px; background: var(--line); }\n.tk span { font-size: 12px; color: var(--mut); }\n.tk.on i, .tk.past i { background: var(--acc); }\n.tk.on span { color: var(--ink); font-weight: 700; }\n.back { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.backbtn { display: flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; color: va -height: 44px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--acc); background: transparent; color: var(--deep); font-weight: 700; }\n.btn.pri { background: var(--acc); color: var(--acc-ink); }\n.btn.ghost { border-color: var(--line); color: var(--mut); font-weight: 600; }\n.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 16px; border: 0; background: var(--acc); color: var(--acc-ink); font-size: 17px; font-weight: 700; }\n.cta.alt { background: var(--card); color: var(--deep); border: 1.5px solid var(--acc); }\n.cta:disabled { opacity: .45; cursor: default; }\n.obdots { display: flex; gap: 6px; justify-content: center; }\n.obdots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); }\n.obdots i.on { width: 22px; background: var(--acc); }\n.obwrap { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }\n/* plan screen: three collapsible headings, each opening with its own small animation */\n.accd { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }\n.acch { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 12px 16px; background: none; border: 0; text-align: start; color: var(--ink); }\n.acch .ai { flex: none; width: 42px; height: 42px; border-radius: 13px; background: var(--tint); color: var(--deep); display: grid; place-items: center; }\n.acch .at { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.acch .at b { font-family: var(--f-body); font-weight: 700; font-size: 20px; line-height: 1.2; }\n.acch .at small { color: var(--mut); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.acch .chev { flex: none; color: var(--mut); transition: transform .25s; }\n.acch[aria-expanded=\"true\"] .chev { transform: rotate(180deg); }\n.accb { position: relative; padding: 0 16px 16px; overflow: hidden; }\n.accin { display: flex; flex-direction: column; gap: 12px; }\n.accb.play.k-when .accin > :not(:first-child) { animation: accIn .5s ease 1.45s backwards; }\n.accb.play.k-how .accin > :not(:first-child) { animation: accIn .5s ease 1.75s backwards; }\n@keyframes accIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n.accb.play.k-what .tile { animation: tilePop .45s cubic-bezier(.3,1.4,.5,1) calc(2.25s + var(--i, 0) * 70ms) backwards; }\n@keyframes tilePop { from { opacity: 0; transform: scale(.35) translateY(-14px); } to { opacity: 1; transform: none; } }\n.ov { position: absolute; inset: 36px 16px 16px; pointer-events: none; z-index: 2; }\n/* book: a small closed recipe book opens, the recipes are written on its pages, then it zooms in until the recipe tiles take over */\n.ov-book { z-index: 2; }\n.ov-book .bk { position: absolute; top: 6px; left: 7%; right: 7%; height: min(230px, calc(100% - 12px)); perspective: 800px; transform-origin: 50% 40%; animation: bkLife 3s ease-in-out both; }\n.ov-book .pg, .ov-book .cvr .f, .ov-book .cvr .b { position: absolute; top: 0; bottom: 0; width: 50%; border: 1px solid #d9ccaa; box-sizing: border-box; background: #fbf6ea; padding: 14px 12px; overflow: hidden; }\n.ov-book .lp { left: 0; border-radius: 12px 0 0 12px; background-color: #f6eed9; box-shadow: inset -14px 0 14px -10px rgba(0,0,0,.2); }\n.ov-book .rp { right: 0; border-radius: 0 12px 12px 0; box-shadow: inset 14px 0 14px -10px rgba(0,0,0,.2); }\n.ov-book .pg h4, .ov-book .cvr .b h4 { margin: 0 0 6px; font-family: var(--f-disp); font-size: 15px; color: var(--deep); text-align: center; }\n.ov-book .pg p, .ov-book .cvr .b p { margin: 0; display: flex; align-items: center; gap: 7px; padding: 6px 2px; border-bottom: 1px dotted rgba(122,74,31,.4); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.ov-book .pg p::before, .ov-book .cvr .b p::before { c duced-motion: reduce) { .ov { display: none; } .accb.play .accin, .accb.play .tile { animation: none; } }\n.notice { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; }\n.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; }\n.empty b { font-family: var(--f-disp); font-size: 22px; font-weight: 500; }\n\n/* plan */\n.anchors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }\n.anchors button { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; }\n.anchors button[aria-pressed=\"true\"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }\n.when { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; min-height: 80px; cursor: pointer; }\n.when small { display: block; color: var(--mut); font-size: 13px; }\n.when input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }\n.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }\n.strip > div { padding: 12px 14px; min-width: 0; }\n.strip > div + div { border-inline-start: 1px solid var(--line); }\n.strip small { display: block; color: var(--mut); font-size: 13px; }\n.strip b { display: block; font-family: var(--f-disp); font-weight: 400; font-size: 24px; line-height: 1.2; }\n.strip.warn b.w { color: var(--warn); }\n\n/* hero */\n.hero { border-radius: 24px; padding: 22px; background: linear-gradient(160deg, var(--card) 0%, var(--tint) 100%); border: 1px solid var(--tint2); box-shadow: 0 10px 28px rgba(126,58,25,.10); display: flex; flex-direction: column; gap: 4px; }\n.hero .l { font-size: 15px; font-weight: 600; color: var(--mut); display: flex; justify-content: space-between; align-items: center; gap: 8px; }\n.hero .t { font-family: var(--f-disp)
