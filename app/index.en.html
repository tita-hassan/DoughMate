<title>DoughMate EN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Stage track on top, one view at a time (plan, feed, dough, bake, recipes, settings). Warm bakery palette, serif numerals, ring timers with a small animated scene per stage. */
:root {
  --bg: #F5EEE2; --card: #FFFCF6; --ink: #2A1F16; --mut: #6F5F4E; --line: #E7DCCB;
  --acc: #B4572B; --acc-ink: #FFFCF6; --deep: #7E3A19; --tint: #F6E4D2; --tint2: #EBCFB6;
  --dough: #F2D3A0; --dough-edge: #E3BE86; --crust: #D0873F; --bubble: #FFF3DC; --ear: #FFE9C2; --stone: #2A1F16;
  --warn-bg: #F8DDD0; --warn: #8A2F12;
  --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.05);
  --f-disp: 'Frank Ruhl Libre', Georgia, serif;
  --f-body: 'Assistant', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1510; --card: #261C15; --ink: #F3E9DC; --mut: #BBA992; --line: #3A2D22;
    --acc: #E58A55; --acc-ink: #1C1510; --deep: #F0B48E; --tint: #3A281C; --tint2: #5A3D29;
    --dough: #D9B27C; --dough-edge: #B98F58; --crust: #C47A38; --bubble: #F6DDB0; --stone: #6B5644;
    --warn-bg: #4A241A; --warn: #F2A98A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1510; --card: #261C15; --ink: #F3E9DC; --mut: #BBA992; --line: #3A2D22;
  --acc: #E58A55; --acc-ink: #1C1510; --deep: #F0B48E; --tint: #3A281C; --tint2: #5A3D29;
  --dough: #D9B27C; --dough-edge: #B98F58; --crust: #C47A38; --bubble: #F6DDB0; --stone: #6B5644;
  --warn-bg: #4A241A; --warn: #F2A98A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
h1, h2, h3, p { margin: 0; }
.mut { color: var(--mut); }

/* header and track */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-disp); font-size: 21px; font-weight: 500; direction: ltr; letter-spacing: -.3px; }
.brand b { color: var(--acc); font-weight: 500; }
.icons { display: flex; gap: 4px; }
.ib { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink); }
.ib[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tk { background: none; border: 0; padding: 6px 0 2px; display: flex; flex-direction: column; gap: 6px; text-align: start; min-height: 44px; }
.tk i { display: block; height: 3px; border-radius: 2px; background: var(--line); }
.tk span { font-size: 12px; color: var(--mut); }
.tk.on i, .tk.past i { background: var(--acc); }
.tk.on span { color: var(--ink); font-weight: 700; }
.back { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.backbtn { display: flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; color: var(--acc); font-weight: 700; padding: 0; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec h2 { font-family: var(--f-disp); font-weight: 500; font-size: 24px; line-height: 1.2; }
.sec .sub { color: var(--mut); font-size: 14px; margin-top: -8px; }
.ttl { font-family: var(--f-disp); font-weight: 500; font-size: 30px; line-height: 1.15; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.rowx { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 8px; }
.seg button { min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; padding: 4px 6px; line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.seg button.dflt:not([aria-pressed="true"]) { color: var(--mut); border-style: dashed; }
.stp { display: flex; align-items: center; gap: 2px; flex: none; }
.stp button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); font-size: 22px; line-height: 1; display: grid; place-items: center; padding: 0; }
.stp button:disabled { opacity: .35; cursor: default; }
.stp output { min-width: 66px; text-align: center; font-family: var(--f-disp); font-size: 19px; font-weight: 500; color: var(--acc); font-variant-numeric: tabular-nums; }
.stp output.dflt { color: var(--mut); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.link { background: none; border: 0; color: var(--acc); font-weight: 700; padding: 0 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.btn { min-height: 44px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--acc); background: transparent; color: var(--deep); font-weight: 700; }
.btn.pri { background: var(--acc); color: var(--acc-ink); }
.btn.ghost { border-color: var(--line); color: var(--mut); font-weight: 600; }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 16px; border: 0; background: var(--acc); color: var(--acc-ink); font-size: 17px; font-weight: 700; }
.cta.alt { background: var(--card); color: var(--deep); border: 1.5px solid var(--acc); }
.cta:disabled { opacity: .45; cursor: default; }
.obdots { display: flex; gap: 6px; justify-content: center; }
.obdots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); }
.obdots i.on { width: 22px; background: var(--acc); }
.obwrap { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
/* plan screen: three collapsible headings, each opening with its own small animation */
.accd { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.acch { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 12px 16px; background: none; border: 0; text-align: start; color: var(--ink); }
.acch .ai { flex: none; width: 42px; height: 42px; border-radius: 13px; background: var(--tint); color: var(--deep); display: grid; place-items: center; }
.acch .at { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.acch .at b { font-family: var(--f-body); font-weight: 700; font-size: 20px; line-height: 1.2; }
.acch .at small { color: var(--mut); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acch .chev { flex: none; color: var(--mut); transition: transform .25s; }
.acch[aria-expanded="true"] .chev { transform: rotate(180deg); }
.accb { position: relative; padding: 0 16px 16px; overflow: hidden; }
.accin { display: flex; flex-direction: column; gap: 12px; }
.accb.play.k-when .accin > :not(:first-child) { animation: accIn .5s ease 1.45s backwards; }
.accb.play.k-how .accin > :not(:first-child) { animation: accIn .5s ease 1.75s backwards; }
@keyframes accIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.accb.play.k-what .tile { animation: tilePop .45s cubic-bezier(.3,1.4,.5,1) calc(2.25s + var(--i, 0) * 70ms) backwards; }
@keyframes tilePop { from { opacity: 0; transform: scale(.35) translateY(-14px); } to { opacity: 1; transform: none; } }
.ov { position: absolute; inset: 36px 16px 16px; pointer-events: none; z-index: 2; }
/* book: a small closed recipe book opens, the recipes are written on its pages, then it zooms in until the recipe tiles take over */
.ov-book { z-index: 2; }
.ov-book .bk { position: absolute; top: 6px; left: 7%; right: 7%; height: min(230px, calc(100% - 12px)); perspective: 800px; transform-origin: 50% 40%; animation: bkLife 3s ease-in-out both; }
.ov-book .pg, .ov-book .cvr .f, .ov-book .cvr .b { position: absolute; top: 0; bottom: 0; width: 50%; border: 1px solid #d9ccaa; box-sizing: border-box; background: #fbf6ea; padding: 14px 12px; overflow: hidden; }
.ov-book .lp { left: 0; border-radius: 12px 0 0 12px; background-color: #f6eed9; box-shadow: inset -14px 0 14px -10px rgba(0,0,0,.2); }
.ov-book .rp { right: 0; border-radius: 0 12px 12px 0; box-shadow: inset 14px 0 14px -10px rgba(0,0,0,.2); }
.ov-book .pg h4, .ov-book .cvr .b h4 { margin: 0 0 6px; font-family: var(--f-disp); font-size: 15px; color: var(--deep); text-align: center; }
.ov-book .pg p, .ov-book .cvr .b p { margin: 0; display: flex; align-items: center; gap: 7px; padding: 6px 2px; border-bottom: 1px dotted rgba(122,74,31,.4); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-book .pg p::before, .ov-book .cvr .b p::before { content: ''; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--dough); border: 1px solid var(--dough-edge); }
.ov-book .cvr .b p, .ov-book .cvr .b h4 { animation: bkShow .35s ease both; animation-delay: calc(.75s + var(--n, 0) * 100ms); }
.ov-book .lp p { animation: bkShow .35s ease both; animation-delay: calc(.85s + var(--n, 0) * 100ms); }
.ov-book .cvr { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; transform-origin: right center; animation: bkTurn .7s cubic-bezier(.5,0,.25,1) .3s both; }
.ov-book .cvr .f, .ov-book .cvr .b { left: 0; width: 100%; backface-visibility: hidden; }
.ov-book .cvr .f { background: var(--deep); border-color: var(--deep); border-radius: 12px 0 0 12px; box-shadow: inset 0 0 0 6px rgba(255,255,255,.12); display: grid; place-items: center; text-align: center; color: var(--card); font-family: var(--f-disp); font-size: 20px; line-height: 1.2; }
.ov-book .cvr .b { transform: rotateY(180deg); border-radius: 0 12px 12px 0; background-color: #f6eed9; box-shadow: inset 14px 0 14px -10px rgba(0,0,0,.2); }
@keyframes bkTurn { from { transform: rotateY(0); } to { transform: rotateY(-180deg); } }
@keyframes bkShow { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes bkLife { 0% { transform: translateX(25%) scale(.62); opacity: 0; } 6% { transform: translateX(25%) scale(.62); opacity: 1; } 26% { transform: translateX(0) scale(.8); opacity: 1; } 64% { transform: translateX(0) scale(.86); opacity: 1; } 92% { transform: translateX(0) scale(1.7); opacity: 0; } 100% { transform: translateX(0) scale(1.7); opacity: 0; } }
/* hourglass: flips, sand runs, then the time settings appear */
.ov-clock, .ov-jar { background: var(--card); display: grid; place-items: start center; padding-top: 14px; }
.ov-clock { animation: ovOut .4s ease 1.55s both; }
.ov-jar { animation: ovOut .4s ease 1.85s both; }
@keyframes ovOut { to { opacity: 0; } }
.ck-h, .ck-m { transform-origin: 50px 50px; animation: ckH 1.5s cubic-bezier(.35,.1,.25,1) both; }
.ck-m { animation-name: ckM; }
@keyframes ckH { from { transform: rotate(0deg); } to { transform: rotate(var(--ha, 360deg)); } }
@keyframes ckM { from { transform: rotate(0deg); } to { transform: rotate(var(--ma, 720deg)); } }
/* sourdough jar: a spoon pours in the feed, stirs, and leaves */
.fjsvg { overflow: visible; }
.fj-sp { animation: fjSpoon 1.9s linear both; }
@keyframes fjSpoon {
  0% { transform: translate(112px,-16px) rotate(30deg); opacity: 0; } 6% { opacity: 1; }
  18% { transform: translate(80px,12px) rotate(28deg); } 32% { transform: translate(66px,42px) rotate(8deg); }
  40% { transform: translate(60px,66px) rotate(0deg); } 48% { transform: translate(78px,72px) rotate(-7deg); }
  56% { transform: translate(46px,72px) rotate(7deg); } 64% { transform: translate(78px,72px) rotate(-7deg); }
  72% { transform: translate(46px,72px) rotate(7deg); } 80% { transform: translate(62px,64px) rotate(0deg); }
  92% { transform: translate(92px,0) rotate(22deg); opacity: 1; } 100% { transform: translate(116px,-18px) rotate(30deg); opacity: 0; } }
.fj-drop { animation: fjDrop 1.9s linear both; opacity: 0; }
@keyframes fjDrop { 0%, 17% { transform: translate(78px,14px); opacity: 0; } 19% { opacity: 1; } 32% { transform: translate(62px,80px); opacity: 1; } 34%, 100% { transform: translate(62px,82px) scale(.2); opacity: 0; } }
.fj-d { animation: fjRise 1.9s ease-out both; }
@keyframes fjRise { 0%, 30% { transform: translateY(96px); } 42%, 100% { transform: translateY(80px); } }
.fj-wave { animation: fjSwirl .25s ease-in-out .76s 3 alternate both; }
@keyframes fjSwirl { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
.fj-b { transform-box: fill-box; transform-origin: center; animation: fjB .5s ease-out both; }
@keyframes fjB { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ov { display: none; } .accb.play .accin, .accb.play .tile { animation: none; } }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty b { font-family: var(--f-disp); font-size: 22px; font-weight: 500; }

/* plan */
.anchors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.anchors button { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; }
.anchors button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.when { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; min-height: 80px; cursor: pointer; }
.when small { display: block; color: var(--mut); font-size: 13px; }
.when input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.strip > div { padding: 12px 14px; min-width: 0; }
.strip > div + div { border-inline-start: 1px solid var(--line); }
.strip small { display: block; color: var(--mut); font-size: 13px; }
.strip b { display: block; font-family: var(--f-disp); font-weight: 400; font-size: 24px; line-height: 1.2; }
.strip.warn b.w { color: var(--warn); }

/* hero */
.hero { border-radius: 24px; padding: 22px; background: linear-gradient(160deg, var(--card) 0%, var(--tint) 100%); border: 1px solid var(--tint2); box-shadow: 0 10px 28px rgba(126,58,25,.10); display: flex; flex-direction: column; gap: 4px; }
.hero .l { font-size: 15px; font-weight: 600; color: var(--mut); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero .t { font-family: var(--f-disp); font-weight: 300; font-size: 76px; line-height: 1.02; color: var(--acc); direction: ltr; text-align: start; }
.hero .t.m { font-size: 64px; }
.hero .s { font-size: 15px; color: var(--mut); }
.pill { background: var(--tint); color: var(--deep); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; direction: ltr; }
.amts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.amts div { background: var(--tint); border-radius: 14px; padding: 12px 6px; text-align: center; }
.amts b { display: block; font-family: var(--f-disp); font-weight: 300; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.amts span { font-size: 13px; color: var(--mut); }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acc); }
.meta2 { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--mut); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.dotb { width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.dotb span { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--line); display: grid; place-items: center; color: var(--acc-ink); }
.dotb span.run { border-color: var(--acc); }
.dotb span.run::after { content: ""; width: 10px; height: 10px; border-radius: 5px; background: var(--acc); }
.dotb span.ok { background: var(--acc); border-color: var(--acc); }
.tl .b { padding-top: 10px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tl .st { font-size: 17px; font-weight: 700; line-height: 1.35; }
.tl .wt .st { font-size: 15px; font-weight: 600; color: var(--mut); }
.tl .done .st, .tl .done .sx { color: var(--mut); }
.tl .done .st { font-weight: 600; }
.tl .sx { font-size: 14px; color: var(--mut); }

/* timer card */
.tcard { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.ring { position: relative; width: 168px; height: 168px; flex: none; }
.ring > svg.r { display: block; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring .rd { font-family: var(--f-disp); font-size: 28px; line-height: 1.1; color: var(--deep); direction: ltr; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.ring .rd.long { font-size: 21px; }
.tside { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.tside .tl1 { font-size: 15px; font-weight: 600; color: var(--deep); line-height: 1.3; }
.tside .tm { font-size: 13px; color: var(--mut); }
.tbtns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.rb { width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--acc); background: transparent; color: var(--deep); display: grid; place-items: center; padding: 0; }
.rb.fill { background: var(--acc); color: var(--acc-ink); width: auto; padding: 0 20px; font-weight: 700; display: flex; gap: 6px; align-items: center; }

/* recipes and settings */
.rhead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; min-height: 60px; background: none; border: 0; text-align: start; }
.rhead b { font-size: 17px; display: block; }
.rhead small { color: var(--mut); font-size: 13px; }
.rbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 22px; }
.fld { display: flex; flex-direction: column; gap: 8px; }
.fld > label, .fld > .lb { font-size: 14px; font-weight: 700; color: var(--mut); }
.fld .sx { font-size: 13px; color: var(--mut); }
.inp { width: 100%; min-height: 46px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.ingrow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 44px; gap: 8px; align-items: center; }
.ingrow input[type=number] { direction: ltr; text-align: center; }
.sgroup { padding: 0 8px 0 12px; padding-inline-start: 16px; display: flex; flex-direction: column; }
.sgroup .sr { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; }
.sgroup .sr + .sr { border-top: 1px solid var(--line); }
.sgroup .sr > span { font-weight: 600; }
.sgroup .sr small { display: block; font-size: 12px; color: var(--mut); font-weight: 400; }
.rstep { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; background: var(--bg); border-radius: 14px; padding: 0 8px 0 12px; padding-inline-start: 14px; }
.rstep + .rstep { margin-top: 8px; }

/* recipe tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 112px; padding: 12px 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); color: var(--acc); text-align: center; }
.tile .nm { color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.tile.on { border-color: var(--acc); background: var(--tint); box-shadow: inset 0 0 0 1px var(--acc); }
.tile.add { border-style: dashed; background: transparent; box-shadow: none; }

      var obj = ctxObj(ctx); if (!obj) break;
      var cur = obj[key] != null ? obj[key] : (key === 'toShape' || key === 'warmH' ? autoVal(key, ctx === 'draft' ? draft.temp : S.settings.temp) : S.settings[key]);
      obj[key] = clamp(key, cur + dd * bd[2]);
      break;
    }
  }
  render();
}
app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || !app.contains(el)) return;
  unlockAudio(); onAct(el.dataset.act, el);
});
var saveT = null;
app.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.cal) {
    var cp = t.dataset.cal.split('|'), ct = calcOf(cp[0]), val = parseFloat(t.value);
    if (!isNaN(val) && val > 0) { if (cp[1] === 'peak') ct.peak[cp[2]][cp[3]] = val; else ct[cp[1]][cp[3]] = val; }
  } else if (t.dataset.ing) { var p = t.dataset.ing.split(':'), r = recipeById(p[0]); if (r && r.ing[+p[1]]) r.ing[+p[1]][p[2]] = p[2] === 'a' ? (parseFloat(t.value) || 0) : t.value; }
  else if (t.dataset.rname) { var rr = recipeById(t.dataset.rname); if (rr) rr.name = t.value; }
  clearTimeout(saveT); saveT = setTimeout(save, 300);
});
app.addEventListener('change', function (e) {
  var el = e.target, bk = el.dataset && el.dataset.bk;
  if (el.classList.contains('daySel')) {
    var cur = new Date(atOf(bk)), n = new Date(+el.value);
    n.setHours(cur.getHours(), cur.getMinutes(), 0, 0); S.plan.ats[bk] = n.getTime(); render();
  } else if (el.classList.contains('timeIn')) {
    var m = /^\s*(\d{1,2})\s*[:.]?\s*(\d{2})?\s*$/.exec(el.value);
    if (m && +m[1] < 24 && +(m[2] || 0) < 60) { var dd = new Date(atOf(bk)); dd.setHours(+m[1], +(m[2] || 0), 0, 0); S.plan.ats[bk] = dd.getTime(); }
    render();
  }
});

/* ---------- ticking ---------- */
function updRings() {
  var b = B(); if (!b) return;
  var rings = app.querySelectorAll('.ring[data-tid]');
  for (var i = 0; i < rings.length; i++) {
    var id = rings[i].getAttribute('data-tid'), it = timerItem(b, id); if (!it) continue;
    var st = tstate(b, it); if (st.mode === 'idle') continue;
    var rd = rings[i].querySelector('.rd'), rp = rings[i].querySelector('.rp');
    if (rd) { rd.textContent = fmt(st.left); rd.classList.toggle('long', st.left >= 3600); }
    if (rp) rp.setAttribute('stroke-dashoffset', (C * (1 - Math.min(1, Math.max(0, 1 - st.left / st.total)))).toFixed(1));
  }
}
function loop() {
  if (!S.brews.length) return;
  var now = Date.now(), fired = false;
  S.brews.forEach(function (b) {
    Object.keys(b.timers).forEach(function (id) {
      var T = b.timers[id];
      if (T.end && T.end <= now && !T.notified) {
        T.notified = true; fired = true;
        var it = timerItem(b, id);
        if (it) toast((S.brews.length > 1 ? b.name + ': ' : '') + it.title, it.timer.msg);
        beep();
      }
    });
  });
  if (fired) { render(); return; }
  updRings();
}
setInterval(loop, 500);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { loop(); render(); wake(); } });
render();
})();
